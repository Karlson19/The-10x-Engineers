name: Keep the API warm

# Render free instances sleep after 15 minutes of no traffic and then take
# close to a minute to answer the next request. This pings /health often
# enough that a customer never lands on a cold start.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping the health endpoint
    runs-on: ubuntu-latest

    # The deployed API, unless the API_HEALTH_URL repository variable overrides
    # it. This used to be guarded by `if: vars.API_HEALTH_URL != ''`, and since
    # that variable was never set, every run since the workflow was added was
    # skipped and the API was never actually kept warm. A default means the
    # workflow works on a fresh clone with nothing configured, which is the
    # point of it.
    env:
      HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://chrysmec-api.onrender.com/health' }}

    steps:
      - name: Request /health
        run: |
          # A sleeping instance takes close to a minute to answer, and that
          # answer is the whole point of the ping, so the timeout allows for it.
          status=$(curl --silent --show-error --max-time 90 \
            --output /dev/null --write-out "%{http_code}" \
            "$HEALTH_URL")
          echo "Health endpoint returned $status"
          test "$status" = "200"
