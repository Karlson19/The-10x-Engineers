name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chrysmec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chrysmec_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-not-used-outside-continuous-integration
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-outside-continuous-integration
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NODE_ENV: test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The apps import compiled output from packages/shared, and the API
      # imports the generated Prisma client, so both exist before linting.
      - name: Build the shared package
        run: pnpm build:shared

      - name: Generate the Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Seed the database
        run: pnpm db:seed

      - name: Run tests
        run: pnpm test

      - name: Build both apps
        run: pnpm build
