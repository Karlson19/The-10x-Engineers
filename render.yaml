# Render blueprint for the API. Point Render at this file and it creates the
# service with the right build, start and health check already set.
#
# The two JWT secrets are generated by Render, so they never pass through a
# repository, a chat window or anyone's clipboard. DATABASE_URL and CORS_ORIGIN
# are marked sync:false, which means Render asks for them once in the dashboard
# and never stores them here.

services:
  - type: web
    name: chrysmec-api
    runtime: node
    plan: free
    # Closest free region to Ghana.
    region: frankfurt
    healthCheckPath: /health

    # Runs from the repository root, because this is a pnpm workspace and the
    # API depends on the shared package. `pnpm --filter api build` compiles the
    # shared package first, then generates the Prisma client, then the API.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter api build &&
      pnpm --filter api exec prisma migrate deploy
    startCommand: pnpm --filter api start

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # Neon connection string. Use the direct endpoint, not the pooled one:
      # Prisma migrations do not run reliably through PgBouncer, and a
      # long-running Express server gains nothing from the pooler anyway.
      - key: DATABASE_URL
        sync: false

      # Generated by Render, different from each other, never seen by anyone.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # The Vercel origin, with no trailing slash. The deployed one is
      # https://chrysmec.vercel.app — the app is served from there, not from
      # the repository-named domain this once pointed at.
      - key: CORS_ORIGIN
        sync: false

      # Phase 6 integrations. Leave blank until they are set up.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_USERNAME
        value: sandbox
