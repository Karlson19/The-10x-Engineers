packages:
  - "apps/*"
  - "packages/*"

# pnpm blocks lifecycle scripts by default. These packages need theirs to run:
# Prisma generates its client, argon2 and the native build tools unpack
# platform binaries.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@tailwindcss/oxide": true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@next/env@15.5.22"
  - "@next/eslint-plugin-next@15.5.22"
  - "@next/swc-darwin-arm64@15.5.22"
  - "@next/swc-darwin-x64@15.5.22"
  - "@next/swc-linux-arm64-gnu@15.5.22"
  - "@next/swc-linux-arm64-musl@15.5.22"
  - "@next/swc-linux-x64-gnu@15.5.22"
  - "@next/swc-linux-x64-musl@15.5.22"
  - "@next/swc-win32-arm64-msvc@15.5.22"
  - "@next/swc-win32-x64-msvc@15.5.22"
  - eslint-config-next@15.5.22
  - globals@17.8.0
  - lucide-react@1.27.0
  - next@15.5.22
  - '@hookform/resolvers@5.5.7'
